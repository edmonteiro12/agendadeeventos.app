# nginx.conf - Para servidores Nginx

server {
    listen 80;
    listen 443 ssl;
    server_name seu-dominio.com;
    
    root /var/www/html/sistema-agenda;
    index index.html index.php;
    
    # SSL (opcional)
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location /api/ {
        try_files $uri $uri/ /backend/api/$uri.php?$args;
        rewrite ^/api/([^/]+)/?$ /backend/api/$1.php last;
    }
    
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    # CORS
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        return 204;
    }
    
    # Deny access to sensitive files
    location ~* \.(sql|log|ini|env|json|lock)$ {
        deny all;
    }
    
    location ~* (config|database|installed)\.php$ {
        deny all;
    }
    
    # Cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}